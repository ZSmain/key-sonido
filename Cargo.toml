[package]
name = "key-sonido"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["full", "signal"] }
inquire = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rodio = "0.17"
evdev = "0.12"
daemonize = "0.5"
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"
fs2 = "0.4"
dirs = "5.0"
anyhow = "1.0"
device_query = "2.1"